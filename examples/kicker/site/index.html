<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board</title>
    <meta name="description" content="A place's board, events and people, for its members." />
    <!-- Archivo's Latin file, asked for with the page rather than once its
         stylesheet is read (app.css's @font-face). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2"
    />
    <!-- The host's `os`, which the app asks for everything. -->
    <script src="/_os/kit.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
