# Deploys main to next.opensocial.fyi on each push.
#
# A pull is merged into main once its checks pass on it merged with main,
# and the review bot approves it, so this does not wait for main's own
# checks. It couldn't: a step can't read a private repository's checks
# (knotless issue at://did:plc:bcgltzqazw5tb6k2g3ttenbj/dev.knotless.issue/3mzlv5ic46umh).
# The merge queue is off while knotless can't land a private repository's
# queue through its gateway.
#
# The host runs on the grain box as the compose project /etc/group-host
# (hetzner-infra's stacks/opensocial). This run reaches it with
# GROUP_HOST_DEPLOY_KEY, a key the box takes only for its forced command,
# group-host-deploy, which can build group-host from an archive, bring a
# build up, drop one, or save the one running, and nothing else
# (hetzner-infra's stacks/opensocial/files/group-host-deploy.sh). The key
# is sealed to ci.knotless.dev, the runner that runs only its owner's
# repositories, for pushes to main alone, so no other run sees it.
#
# The commit is built on the box as group-host:build-<commit>, then goes
# up: the running image is kept as group-host:before-<commit> to roll back
# to, and the host must name this commit in /xrpc/_health, on the box and
# then as the network reaches it. Deploys run one at a time, in the order
# main moved (superseded: finish), so none is cut off halfway and an older
# commit never goes up after a newer one.
#
# Once up, the image is published as the release of the `group-host`
# package at main's version, if that version has none yet: `box save`
# streams `docker save` of the running image, an OCI image layout, into
# `knotless release publish --oci`, as the owner, with RELEASE_PASSWORD,
# an app password of theirs sealed to this runner for main alone, the
# version's CHANGELOG.md section as its notes. It is then `docker pull
# knotless.dev/chadtmiller.com/group-host:<version>`, the image
# next.opensocial.fyi runs. Without RELEASE_PASSWORD, nothing is published.
on:
  push:
    refs: [refs/heads/main]
superseded: finish
runners: [ci.knotless.dev]
image: alpine:3.22
secrets: [GROUP_HOST_DEPLOY_KEY, RELEASE_PASSWORD]
env:
  # The grain box, which serves next.opensocial.fyi, and its host key, as
  # hetzner-infra's ci/known_hosts pins it.
  GROUP_HOST_BOX: root@opensocial.fyi
  GRAIN_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINaUk4YyxTjCsPg1XOsCIJiB1NlEakc9/tnS+QeYRRNQ
  GROUP_HOST_URL: https://next.opensocial.fyi
  REPO: knotless://chadtmiller.com/group-host
  KNOTLESS_APPVIEW: https://knotless.dev
steps:
  - name: tools
    run: |
      apk add --no-cache curl git openssh-client >/dev/null
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      printf '%s\n' "$GROUP_HOST_DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      echo "opensocial.fyi $GRAIN_HOST_KEY" > ~/.ssh/known_hosts
      printf 'Host *\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' > ~/.ssh/config
      # The box's forced command, given what to do and this commit.
      cat > /usr/local/bin/box <<'EOF'
      #!/bin/sh
      exec ssh "$GROUP_HOST_BOX" "$1 $KNOTLESS_RUN_SHA"
      EOF
      chmod +x /usr/local/bin/box
  - name: build
    run: |
      git config --global --add safe.directory "$PWD"
      git archive --format=tar "$KNOTLESS_RUN_SHA" | box build
    timeout: 30
  - name: deploy
    run: |
      box up
      # As the network reaches it, through the proxy: the host names this
      # commit within a minute, as it restarts, or the deploy fails.
      for i in $(seq 30); do
        health=$(curl -fsS "$GROUP_HOST_URL/xrpc/_health" || true)
        case "$health" in *"\"$KNOTLESS_RUN_SHA\""*) echo "$health"; exit 0 ;; esac
        sleep 2
      done
      echo "$GROUP_HOST_URL names no $KNOTLESS_RUN_SHA: ${health:-no answer}"
      echo "the box runs group-host:current at this commit, but it is not healthy;"
      echo "to roll back: docker tag group-host:before-$(echo "$KNOTLESS_RUN_SHA" | cut -c1-12) group-host:current, then docker compose up -d in /etc/group-host"
      exit 1
  - name: image
    run: |
      [ -n "$RELEASE_PASSWORD" ] || { echo "no RELEASE_PASSWORD: not publishing the image"; exit 0; }
      curl -fsSL "$KNOTLESS_APPVIEW/install.sh" | KNOTLESS_INSTALL_DIR=/usr/local/bin sh
      version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
      if knotless release list "$REPO" group-host | cut -f2 | grep -qxF "$version"; then
        echo "group-host $version is published already"
        exit 0
      fi
      dir=$(mktemp -d)
      box save | tar -x -C "$dir"
      # The version's section of the changelog, less its heading.
      awk -v v="$version" '/^## / { on = ($2 == v); next } on' CHANGELOG.md > ~/.notes
      KNOTLESS_IDENTIFIER=chadtmiller.com KNOTLESS_PASSWORD="$RELEASE_PASSWORD" \
        knotless release publish "$REPO" group-host "$version" --oci "$dir" --commit "$KNOTLESS_RUN_SHA" --notes - < ~/.notes
      echo "published: docker pull knotless.dev/chadtmiller.com/group-host:$version"
    timeout: 20
