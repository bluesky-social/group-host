# The tests, under `just cov`'s gate: every test binary, failing under 100%
# of lines or functions. A binary the tests start (the host, the command)
# is counted as it runs, so it is told to stop rather than killed.
#
# The tests that reach the network run against the reference PDS and PLC
# (harness/pds.mjs), on the space alpha built at ATPROTO_COMMIT. Node,
# the harness's packages, the alpha's build, cargo-llvm-cov and the build
# are kept between runs; each is made again only when what it is made from
# changes.
image: rust:1.98
# A pre-flight, as check is: the merge queue takes a pull into a batch only
# once this has passed at its head.
queue: first
on:
  push: {refs: [refs/heads/main]}
  pull: {base: [refs/heads/main, refs/heads/feature/*]}
cache: [target, /usr/local/cargo/registry, /usr/local/rustup, /opt/tools, /opt/node, /opt/atproto, harness/node_modules]
env:
  # The space alpha the tests run against.
  ATPROTO_COMMIT: 11c5d98cd50261c5e1201fedc5c6c05a7b8d1ccf
  # Bumped when the steps that build the alpha change, to build it again.
  ALPHA_BUILD: "2"
steps:
  - uses: chadtmiller.com/steps/node@1
    with: {version: 24.22.1}
  - uses: chadtmiller.com/steps/npm-ci@1
    name: harness
    with: {dir: harness, omit: dev}
  - uses: chadtmiller.com/steps/cargo-llvm-cov@1
    with: {version: 0.9.1}
  - name: spaces alpha
    run: |
      [ "$(cat /opt/atproto/.built 2>/dev/null)" = "$ATPROTO_COMMIT $ALPHA_BUILD" ] && exit 0
      export PATH=/opt/node/bin:$PATH COREPACK_ENABLE_DOWNLOAD_PROMPT=0 COREPACK_HOME=/opt/atproto/.corepack
      find /opt/atproto -mindepth 1 -delete
      cd /opt/atproto
      git init -q . && git fetch -q --depth 1 https://github.com/bluesky-social/atproto.git "$ATPROTO_COMMIT" && git checkout -q FETCH_HEAD
      mkdir .bin && corepack enable --install-directory /opt/atproto/.bin
      export PATH=/opt/atproto/.bin:$PATH
      pnpm install --frozen-lockfile --ignore-scripts
      pnpm run build:tooling --force
      pnpm --filter '@atproto/dev-env^...' --filter @atproto/dev-env run --if-present prebuild
      pnpm exec tsc --build packages/dev-env/tsconfig.build.json
      # The PDS serves its OAuth sign-in pages from this bundle, and will
      # not start without it.
      pnpm --filter @atproto/oauth-provider-ui run build:ui
      echo "$ATPROTO_COMMIT $ALPHA_BUILD" > /opt/atproto/.built
  - name: sqlite
    run: |
      # SQLite's native module for the alpha's PDS, which the install above
      # skips building, and the harness's own for the stock PDS.
      export PATH=/opt/node/bin:$PATH
      for from in /opt/atproto/packages/pds harness; do
        dir="$(dirname "$(node -p "require.resolve('better-sqlite3/package.json', { paths: ['$from'] })")")"
        [ -f "$dir/build/Release/better_sqlite3.node" ] || (cd "$dir" && npm run install)
      done
  - name: test
    run: |
      export PATH=/opt/node/bin:/opt/tools:$PATH GROUP_HOST_DEV_ENV=/opt/atproto/packages/dev-env
      cargo llvm-cov --workspace --ignore-filename-regex '(tests/|harness/)' \
        --fail-under-lines 100 --fail-under-functions 100 --show-missing-lines
