# `cargo deny check`, in the `check` workflow: the dependencies'
# advisories, licences, bans and sources (docs/development.md, "The
# checks").

[graph]
all-features = true

[advisories]
# Every advisory of the RustSec database fails the check, unmaintained and
# unsound crates too, and a yanked version.
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
version = 2
# Permissive licences only, so the host can be shipped under any of them.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
# The path dependencies between the workspace's crates have no version;
# they are let off as none of the crates is published (Cargo.toml).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io, and the registry the atproto crate is published to
# (.cargo/config.toml).
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  "sparse+https://knotless.dev/cargo/did:plc:bcgltzqazw5tb6k2g3ttenbj/3mzr5vldibtui/",
]
