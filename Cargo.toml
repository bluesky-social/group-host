[workspace]
members = ["crates/group-host", "crates/group-host-mcp", "crates/atgrp"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
# Nothing here goes to a registry; cargo-deny reads this to know the path
# dependencies between the crates are no wildcards (deny.toml).
publish = false

# No unsafe code, in any target of any crate.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
atproto = { version = "0.4.0", registry = "atproto" }
group-host = { path = "crates/group-host" }
group-host-mcp = { path = "crates/group-host-mcp" }
anyhow = "1"
# axum's defaults but tower-log, which turns on tracing's log feature: each
# event's fields are then written out twice, the second time for the log
# crate, which nothing here reads, and coverage counts that copy as never run.
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "tracing", "ws"] }
futures = "0.3"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "gzip"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json", "env-filter", "registry"] }

# Every worktree keeps its own target/, so debug info is kept small: line
# tables for our crates, none for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The image's (Dockerfile): release's, built for the build's time, in 16
# codegen units without LTO, so a deploy rebuilds our crates on every core.
[profile.deploy]
inherits = "release"
lto = false
codegen-units = 16
